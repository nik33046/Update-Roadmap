name: Update WD Roadmap

on:
  schedule:
    # Run once a day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Allow manual triggers from the GitHub UI

jobs:
  update-roadmap:
    name: Fetch JIRA Epics & Publish Roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run roadmap updater
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BOARD_ID: ${{ secrets.JIRA_BOARD_ID }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          # Optional: override default custom-field IDs if needed
          JIRA_EPIC_LINK_FIELD: ${{ secrets.JIRA_EPIC_LINK_FIELD }}
          JIRA_INITIATIVE_FIELD: ${{ secrets.JIRA_INITIATIVE_FIELD }}
          JIRA_BIZ_OBJ_FIELD: ${{ secrets.JIRA_BIZ_OBJ_FIELD }}
        run: python update_roadmap.py

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
